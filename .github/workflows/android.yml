name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publier une release GitHub avec l'APK"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Si un keystore est fourni en secret, il remplace la clé de sideload du dépôt.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ORGANISATOR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Compiler l'APK de release
        env:
          ORGANISATOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORGANISATOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORGANISATOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK
        id: apk
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Organisator-$VERSION.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=dist/Organisator-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Organisator-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Créer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          # Sur un tag, on reprend son nom ; sur un déclenchement manuel, le tag est
          # déduit de version.properties et créé par gh sur le commit courant.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Organisator $VERSION" \
            --notes-file .github/release-notes.md
